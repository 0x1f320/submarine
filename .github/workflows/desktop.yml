name: Desktop

on:
  workflow_call:
    inputs:
      tauri-changed:
        description: Whether src-tauri/ files changed
        type: boolean
        required: false
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-web:
    name: Check for Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm turbo run typecheck --filter=@submarine/desktop...

  build-web:
    name: Build for Web
    needs: check-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@submarine/desktop...

  check-rust:
    name: Check for Rust
    if: inputs.tauri-changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: cargo fmt & clippy
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check && cargo clippy -- -D warnings

  build-rust:
    name: Build for Rust (${{ matrix.os }})
    needs: check-rust
    if: inputs.tauri-changed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            deps: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
          - os: macos-latest
            deps: ""
          - os: windows-latest
            deps: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install system dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @submarine/desktop tauri build
